kind = "web"
previewPath = "/"
title = "Sunita AI — Odia Science Tutor"
description = "A voice-first science tutoring PWA for Odia-speaking students on shared, low-bandwidth phones. Practice concepts, follow a study plan, record offline doubts, and review learner progress."
version = "1.0.0"
id = "artifacts/sunita-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25364

[services.development]
run = "pnpm --filter @workspace/sunita-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sunita-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/sunita-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25364"
BASE_PATH = "/"
